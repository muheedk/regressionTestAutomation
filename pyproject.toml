[project]
name = "regression-test-tool"
version = "1.0.0"
description = "Interactive regression test automation tool for .NET Core and Java Spring Boot microservices"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "jinja2>=3.1.2",
    "httpx>=0.25.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
oracle = ["oracledb>=1.4.0"]
dev = [
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
